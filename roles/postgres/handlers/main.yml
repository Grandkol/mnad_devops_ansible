- name: Daemon reload
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

- name: Restart Postgres
  ansible.builtin.systemd_service:
    name: postgres.service
    state: restarted
  become: true

- name: Reload Postgres
  ansible.builtin.systemd_service:
    name: postgres.service
    state: reloaded
  become: true

- name: Restart Postgres exporter
  ansible.builtin.systemd_service:
    name: postgres-exporter.service
    state: restarted
  become: true
