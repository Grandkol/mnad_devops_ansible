- name: Create /data
  ansible.builtin.file:
    path: /data
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"
  loop:
    - "{{ postgres__data_dir | dirname }}"
    - "{{ postgres__data_dir }}"

- name: Init database cluster
  ansible.builtin.command:
    cmd: "{{ __bin_dir }}/pg_ctl initdb -D {{ postgres__data_dir }}"
    creates: "{{ postgres__data_dir }}/PG_VERSION"
  become_user: postgres
